name: Deploy to Uberspace

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3

      - name: Run Frontend
        working-directory: frontend/
        run: |
          npm install
          npm start &

      - name: Run Backend
        working-directory: backend/
        run: |
          npm install      
          npm start &

      #- name: Run Cypress Tests Backend
      #  working-directory: backend/
      #  run: |
      #    npx cypress run

      #- name: Run Cypress Tests Frontend
      #  working-directory: frontend/
      #  run: |
      #    npx cypress run

      - name: Install and Build React Frontend
        working-directory: frontend/
        run: |
          export CI=false
          npm run build

      - name: Deploy React Frontend
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan mirfac.uberspace.de >> ~/.ssh/known_hosts
          pwd
          scp -r frontend/build/* kakvadur@mirfac.uberspace.de:/home/kakvadur/html/


      - name: Deploy Backend Executable
        working-directory: backend/
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ls
          pwd
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan mirfac.uberspace.de >> ~/.ssh/known_hosts
          
          # Archive backend folder
          cd ..
          tar -czf backend.tar.gz backend/
          
          # Copy the archive to the server
          scp backend.tar.gz kakvadur@mirfac.uberspace.de:~/
          
          # SSH into the server, extract the archive, and restart the backend
          ssh kakvadur@mirfac.uberspace.de "
            rm -rf ~/backend/ &&
            mkdir -p ~/backend/ &&
            tar -xzf ~/backend.tar.gz -C ~/ &&
            rm ~/backend.tar.gz &&
            supervisorctl restart kvadur-backend
          "
